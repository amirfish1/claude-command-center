<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Session summary</title>
<style>body{background:#0f1115;color:#e6e9ee;font:16px system-ui;margin:24px}li{padding:10px;border-bottom:1px solid #333}button{padding:10px}</style>
<h1>Session summary</h1>
<p>Live titles, engines and states. No transcripts or repository paths.</p>
<button id="load">Read current snapshot</button>
<p id="status" role="status">Waiting for the host…</p>
<ul id="sessions"></ul>
<script>
let requestId;
function load() {
  requestId = 'sessions-' + Date.now();
  parent.postMessage({type:'ccc.app.call', requestId, method:'sessions.read'}, '*');
}
window.addEventListener('message', function (event) {
  if (event.source !== parent || !event.data || event.data.type !== 'ccc.app.result' || event.data.requestId !== requestId) return;
  const data = event.data;
  document.getElementById('status').textContent = data.ok ? 'Snapshot loaded.' : data.error;
  const list = document.getElementById('sessions');
  list.textContent = '';
  if (data.ok) data.result.forEach(function (session) {
    const item = document.createElement('li');
    item.textContent = (session.title || session.session_id || 'Session') + ' · ' + (session.engine || '') + ' · ' + (session.state || '');
    list.appendChild(item);
  });
});
document.getElementById('load').onclick = load;
load();
</script>
