name: App marketplace

on:
  pull_request:
    paths:
      - 'apps-index.json'
      - 'examples/apps/**'
      - 'schemas/app*.schema.json'
      - 'scripts/validate-apps-index.py'
      - 'ccc_server/app_marketplace.py'
      - 'server.py'
      - 'require-puppeteer.js'
      - 'puppeteer-browser-config.js'
      - 'static/app-marketplace*.js'
      - 'static/applications.html'
      - 'tests/*app_marketplace*'
      - '.github/workflows/app-marketplace.yml'
  push:
    branches: [main]
    paths:
      - 'apps-index.json'
      - 'examples/apps/**'
      - 'schemas/app*.schema.json'
      - 'scripts/validate-apps-index.py'
      - 'ccc_server/app_marketplace.py'
      - 'server.py'
      - 'require-puppeteer.js'
      - 'puppeteer-browser-config.js'
      - 'static/app-marketplace*.js'
      - 'static/applications.html'
      - 'tests/*app_marketplace*'
      - '.github/workflows/app-marketplace.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-marketplace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install verification dependencies
        run: |
          python -m pip install pytest jsonschema
          npm install --no-save --package-lock=false puppeteer@25.2.1
      - name: Validate catalog and exercise browser isolation
        env:
          CCC_MARKETPLACE_REQUIRE_BROWSER: '1'
          CCC_MARKETPLACE_SCREENSHOT: ${{ runner.temp }}/marketplace-desktop.png
          CCC_MARKETPLACE_MOBILE_SCREENSHOT: ${{ runner.temp }}/marketplace-mobile.png
          CCC_MARKETPLACE_SESSION_SCREENSHOT: ${{ runner.temp }}/marketplace-session.png
          CCC_MARKETPLACE_QUEUE_SCREENSHOT: ${{ runner.temp }}/marketplace-queue.png
        run: |
          python scripts/validate-apps-index.py
          python -m pytest -q tests/test_app_marketplace.py
      - name: Upload synthetic demo screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-marketplace-screenshots
          path: ${{ runner.temp }}/marketplace-*.png
          if-no-files-found: ignore
