[project]
name = "claude-command-center"
version = "5.37.0"
description = "A local command center for Claude Code that doesn't care how your agents were launched."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Amir Fish" },
]
keywords = ["claude", "claude-code", "kanban", "dashboard", "agent", "session-manager"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: User Interfaces",
]

# Zero runtime dependencies — stdlib only. The `gh`, `claude`, `vercel`, and
# `pkood` integrations are subprocess shell-outs to optional external CLIs;
# install whichever ones you want and the corresponding UI surfaces light up.
dependencies = []

# Optional extras. The core server (`server.py`) stays stdlib-only; these are
# only needed by separately-launched companion processes.
#   acp — the ACP server adapter (`ccc_acp.py`), an Agent Client Protocol
#         bridge so editors/ACP clients can drive Claude Code sessions.
#         Launched on its own: `python3 ccc_acp.py`.
[project.optional-dependencies]
acp = ["agent-client-protocol>=0.10"]

[project.urls]
Homepage = "https://github.com/amirfish1/claude-command-center"
Repository = "https://github.com/amirfish1/claude-command-center"
Issues = "https://github.com/amirfish1/claude-command-center/issues"

[project.scripts]
claude-command-center = "ccc_server.launcher:main"

# Build a wheel locally with `uv build --wheel`; no PyPI publication needed.
# `./run.sh` and `python3 server.py` remain supported from a source checkout.
# The wheel keeps runtime modules and assets in the same relative layout.
[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = [
    "/*.py", "/ccc_server/**", "/_history_index/**", "/static/**",
    "/hooks/**", "/skills/**", "/scripts/install-watchtower.sh",
    "/pyproject.toml", "/README.md", "/LICENSE", "/LICENSE-MIT", "/NOTICE",
]
exclude = ["**/__pycache__/**", "**/*.pyc", "**/.DS_Store", "/static/morning/**"]

[tool.hatch.build.targets.wheel]
only-include = [
    "server.py", "ccc_worker.py", "ccc_acp.py", "ccc_peer_inbound.py",
    "ccc_peer_uds.py", "control_plane.py", "fcntl.py", "federation.py",
    "objects_store.py", "productivity.py", "ssh_multiplexer.py", "worker_engines.py",
    "ccc_server", "_history_index", "static", "hooks", "skills",
    "scripts/install-watchtower.sh",
]

# When/if this is packaged (setuptools/hatch/etc.), the orchestration skill
# under `skills/` must travel with the install — server.py auto-installs
# `skills/ccc-orchestration.md` to `~/.claude/skills/ccc-orchestration/SKILL.md`
# on startup, and that source file has to exist relative to server.py.
# Setuptools-style hint:
[tool.setuptools.package-data]
"*" = ["skills/*.md", "static/**/*", "hooks/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
