[project]
name = "claude-command-center"
version = "5.7.0"
description = "A local command center for Claude Code that doesn't care how your agents were launched."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Amir Fish" },
]
keywords = ["claude", "claude-code", "kanban", "dashboard", "agent", "session-manager"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: User Interfaces",
]

# Zero runtime dependencies — stdlib only. The `gh`, `claude`, `vercel`, and
# `pkood` integrations are subprocess shell-outs to optional external CLIs;
# install whichever ones you want and the corresponding UI surfaces light up.
dependencies = []

# Optional extras. The core server (`server.py`) stays stdlib-only; these are
# only needed by separately-launched companion processes.
#   acp — the ACP server adapter (`ccc_acp.py`), an Agent Client Protocol
#         bridge so editors/ACP clients can drive Claude Code sessions.
#         Launched on its own: `python3 ccc_acp.py`.
[project.optional-dependencies]
acp = ["agent-client-protocol>=0.10"]

[project.urls]
Homepage = "https://github.com/amirfish1/claude-command-center"
Repository = "https://github.com/amirfish1/claude-command-center"
Issues = "https://github.com/amirfish1/claude-command-center/issues"

[project.scripts]
claude-command-center = "server:main"

# No build backend declared — this isn't packaged for PyPI today. Run via
# `./run.sh` or `python3 server.py`. The pyproject.toml exists so tooling
# (ruff, mypy, IDEs) can pick up the project metadata.

# When/if this is packaged (setuptools/hatch/etc.), the orchestration skill
# under `skills/` must travel with the install — server.py auto-installs
# `skills/ccc-orchestration.md` to `~/.claude/skills/ccc-orchestration/SKILL.md`
# on startup, and that source file has to exist relative to server.py.
# Setuptools-style hint:
[tool.setuptools.package-data]
"*" = ["skills/*.md", "static/**/*", "hooks/*.py"]

# `cloud_relay_e2e` tests boot the real ccc-cloud service in-process, which
# pins sys.modules['server'] to the ccc-cloud package for the rest of the
# process (see tests/cloud_relay_harness.py) — shadowing this repo's own
# server.py. Deselected by default so `pytest tests/` stays a single clean
# process; opt in with `pytest -o addopts="" tests/test_cloud_relay_e2e.py`.
[tool.pytest.ini_options]
markers = [
    "cloud_relay_e2e: cloud-relay e2e test that boots the real ccc-cloud service in-process (requires CCC_CLOUD_REPO; excluded from the default run, see tests/cloud_relay_harness.py)",
]
addopts = "-m 'not cloud_relay_e2e'"
