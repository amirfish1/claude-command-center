      --panel: #ffffff;
      --ink: #172233;
      --muted: #48596f;
      --line: #ccd5e0;
      --blue: #2456a6;
      --blue-bg: #edf3fc;
      --purple: #6540a0;
      --purple-bg: #f4effb;
      --green: #226649;
      --green-bg: #edf7f2;
    }
    @media (prefers-color-scheme: dark) {
