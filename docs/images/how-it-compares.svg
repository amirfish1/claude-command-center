<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="compare-title compare-desc">
  <title id="compare-title">How it compares</title>
  <desc id="compare-desc">CCC is a local board across coding agent engines, including sessions started in a terminal. Routers connect apps to models: freellmapi provides free-tier APIs and fallback, 9Router is a local gateway with quota tracking, and OpenRouter provides a model API with provider failover. Claude Squad manages terminal tasks in isolated workspaces, Conductor uses git worktrees on macOS, and Nimbalyst has visual editors and parallel agents. Crystal is now Nimbalyst. For CCC-managed Free ($0) sessions, CCC starts and shows a coding agent whose model requests go through freellmapi to a model provider. Routers are backends, not rivals. Sources are in docs/compare.md, checked 6 October 2026.</desc>
