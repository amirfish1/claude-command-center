# Claude Command Center — opt-in remote-visitor TLS + Basic-auth profile.
#
# WHY THIS EXISTS
#   CCC has no authentication. Its own SECURITY.md is explicit: the trust
#   boundary is "anything that can reach the port can run commands as you".
#   The stock docker-compose.yml publishes the dashboard on 127.0.0.1:8090
#   with no auth, so any process on the host — or any peer, if you widen the
#   bind — gets the full, unauthenticated API (including agent spawn, which
#   runs with --dangerously-skip-permissions).
#
#   This opt-in profile puts a TLS + Basic-auth Caddy proxy in front of
#   CCC for remote visitors. Only Caddy publishes a host port, to loopback
#   by default. Remote access requires an explicit VPN/interface configuration.
#
# WHAT THIS DOES AND DOES NOT PROTECT
#   Remote visitors must authenticate through Caddy. Authenticated callers
#   retain the full CCC API. Basic auth is not a replacement for CCC's
#   same-origin POST checks or a capability sandbox.
#   Native Linux host programs can reach the internal backend directly by
#   its Docker bridge IP, without authenticating. Docker's internal network
#   is NOT a host-process isolation boundary. Local-program hardening is
#   separate work: https://github.com/amirfish1/claude-command-center/issues/222.
#
# USAGE
#   1. cp .env.hardened.example .env.hardened
#   2. Generate a bcrypt password hash and put it in .env.hardened:
#        docker run --rm caddy caddy hash-password --plaintext 'your-strong-password'
#      Set CCC_BASIC_AUTH_USER and CCC_BASIC_AUTH_HASH.
#   3. docker compose --env-file .env.hardened -f docker-compose.hardened.yml up --build
#   4. Open https://localhost:8443  (accept the local self-signed cert once)
#      and log in with the user/password from step 2.
#
# See docs/hardened-deploy.md for the full write-up and verification steps.

services:
  ccc:
    build: .
    image: claude-command-center:local
    container_name: ccc-hardened
    # No published backend port. Caddy joins this network; native Linux host
    # programs can also reach its bridge IP directly, without authentication.
    expose:
      - "8090"
    environment:
      PORT: "8090"
      # Bind 0.0.0.0 INSIDE the container namespace so Caddy (on the same
      # internal Docker network) can reach it. This service publishes no
      # ports, but the native Linux host can still reach the bridge IP.
      CCC_BIND_HOST: "0.0.0.0"
      # Caddy preserves the browser Origin. Allow the intended HTTPS origin
      # explicitly; do not disable CCC's same-origin POST checks.
      CCC_ALLOWED_ORIGIN: "https://localhost:8443"
      # Telemetry off by default in this hardened profile.
      CCC_TELEMETRY_DISABLED: "1"
    volumes:
      # Surface the host's Claude state. Read-write so CCC can persist its own
      # sidecar state under ~/.claude/command-center/. Append `:ro` if you
      # want a look-only dashboard (some writes will then fail).
      - ${HOME}/.claude:/root/.claude
    networks:
      - internal
    restart: unless-stopped

  caddy:
    image: caddy:2
    container_name: ccc-caddy
    depends_on:
      - ccc
    # The ONLY host-published port in this stack. Bound to loopback by
    # default so the proxy itself isn't exposed to the LAN. To reach it from
    # another trusted device (e.g. over a VPN/Tailscale), change the left
    # side to the interface you want — but understand you are then exposing
    # an auth-gated, full-capability control plane. Read docs/hardened-deploy.md.
    ports:
      - "127.0.0.1:8443:8443"
    environment:
      CCC_BASIC_AUTH_USER: "${CCC_BASIC_AUTH_USER:?set CCC_BASIC_AUTH_USER in .env.hardened}"
      CCC_BASIC_AUTH_HASH: "${CCC_BASIC_AUTH_HASH:?set CCC_BASIC_AUTH_HASH in .env.hardened (see docker-compose.hardened.yml header)}"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Persist Caddy's locally-generated TLS cert + internal CA so the cert
      # is stable across restarts (you only trust it once).
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
      - frontend
    restart: unless-stopped

networks:
  # Isolate the backend from external networks, not from the native host.
  # Native Linux host programs can reach this network's container IPs.
  internal:
    internal: true
  # Caddy's public side.
  frontend: {}

volumes:
  caddy_data: {}
  caddy_config: {}
